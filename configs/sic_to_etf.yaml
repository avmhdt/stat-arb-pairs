# SIC range -> SPDR Select Sector ETF, used for etf_sector grouping and the Avellaneda-Lee
# ETF residuals (FR-19). An approximation: SIC is an industry code and GICS sectors are not
# a function of it. The first matching range wins, so narrow ranges come before wide ones.
# Before an ETF has 252 sessions of history (DQ-07) its fallback is used instead.
market: SPY
fallback:
  XLC: XLK    # launched 2018-06-19; communications sat in technology and telecom before
  XLRE: XLF   # launched 2015-10-08; real estate was part of financials until 2016
  XLB: SPY
  XLE: SPY
  XLF: SPY
  XLI: SPY
  XLK: SPY
  XLP: SPY
  XLU: SPY
  XLV: SPY
  XLY: SPY
ranges:
  - [100, 999, XLP]      # agriculture, forestry, fishing
  - [1000, 1099, XLB]    # metal mining
  - [1200, 1399, XLE]    # coal, oil and gas extraction and services
