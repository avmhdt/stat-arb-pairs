[project]
name = "statarb"
version = "0.1.0"
description = "Distance, cointegration and Avellaneda-Lee residual statistical arbitrage on survivorship-free US equities."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "avmhdt" }]
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=18",
    "numpy>=2.0",
    "scipy>=1.14",
    "numba>=0.61",
    "statsmodels>=0.14.4",
    "pandas>=2.2",
    "exchange-calendars>=4.5",
    "httpx>=0.27",
    "tenacity>=9.0",
    "typer>=0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "structlog>=24.4",
    "eqpit",
]

[project.optional-dependencies]
wrds = ["wrds>=3.2"]
# Sharadar is reached through httpx, so the extra adds nothing; it exists so that
# `uv sync --extra sharadar` reads the same as the other providers.
sharadar = []
plotly = ["plotly>=5.24"]

[project.scripts]
statarb = "statarb.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statarb"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.112",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "overfitlab",
]

[tool.uv.sources]
overfitlab = { git = "https://github.com/avmhdt/backtest-overfitting-lab" }
eqpit = { git = "https://github.com/avmhdt/equity-factor-pipeline", subdirectory = "packages/eqpit" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/statarb"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["exchange_calendars.*", "numba.*", "pyarrow.*", "scipy.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
pythonpath = ["tests"]
markers = [
    "slow: slower tests, run locally before each milestone exit",
    "data: needs local licensed or downloaded data, never in CI",
    "network: needs live network access, never in CI",
]

[tool.coverage.run]
branch = false
# Kept inside an ignored folder, so the coverage file never shows up in git status.
data_file = ".pytest_cache/coverage"
source_pkgs = ["statarb"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '^\s*\.\.\.$']
